# 1Panel / CasaOS / Portainer 可直接导入此文件
# 使用前复制为 docker-compose.yml 并准备 .env

services:
  mihomo:
    image: purewhiteicecream/mihomo-sub:latest
    container_name: mihomo-sub
    environment:
      TZ: Asia/Shanghai
      sub_url: https://your-subscription-url.com
      # 不定期更新（仅启动时拉取一次）改为 off
      cron: "0 4 * * *"
      # 局域网面板不要密码时改为 off，不要把 9090 暴露到公网
      SECRET: change-me
      ALLOW_LAN: "true"
      MIXED_PORT: "7890"
      CONTROLLER_PORT: "9090"
    volumes:
      - data:/root/.config/mihomo
    ports:
      - "7890:7890"
      - "9090:9090"
    restart: unless-stopped

volumes:
  data:
