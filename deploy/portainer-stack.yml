# 1Panel / CasaOS / Portainer 可直接导入此文件
# 使用前复制为 docker-compose.yml 并准备 .env

services:
  mihomo:
    image: purewhiteicecream/mihomo-sub:latest
    container_name: mihomo-sub
    environment:
      TZ: Asia/Shanghai
      sub_url: https://your-subscription-url.com
      cron: "0 4 * * *"
      # 局域网不想输密钥时改为 "off"
      SECRET: change-me
      ALLOW_LAN: "true"
      MIXED_PORT: "7890"
      CONTROLLER_PORT: "9090"
    volumes:
      - mihomo-data:/root/.config/mihomo
    ports:
      - "7890:7890"
      - "9090:9090"
    restart: unless-stopped

volumes:
  mihomo-data:
